<!doctype html>
<html lang="en-US">
<meta charset="utf-8">
<title>Redirecting…</title>
<link rel="canonical" href="{{ page.redirect.to }}">
<meta name="robots" content="noindex">
<script>
  // Keep an old deep link's fragment: /research/#korean-asr -> /#korean-asr
  (function () {
    var to = "{{ page.redirect.to }}";
    if (location.hash && to.indexOf('#') !== -1) to = to.split('#')[0] + location.hash;
    location.replace(to);
  })();
</script>
<meta http-equiv="refresh" content="0; url={{ page.redirect.to }}">
<h1>Redirecting…</h1>
<a href="{{ page.redirect.to }}">Click here if you are not redirected.</a>
</html>
