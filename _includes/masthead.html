<a class="skip-link" href="#main">Skip to content</a>
<div class="masthead"><div class="site-header">
<a class="site-name" href="{{ '/' | relative_url }}">{{ site.title }}</a>
<nav class="site-navigation" aria-label="Main navigation">
{% for link in site.data.navigation.main %}
{% assign is_current = false %}
{% if page.url == link.url %}{% assign is_current = true %}{% elsif link.url != '/' and page.url contains link.url %}{% assign is_current = true %}{% endif %}
<a href="{{ link.url | relative_url }}"{% if is_current %} aria-current="page"{% endif %}>{{ link.title }}</a>
{% endfor %}
</nav>
<button class="color-toggle" type="button" aria-label="Switch to dark theme" aria-pressed="false"><span aria-hidden="true">◐</span></button>
</div></div>
