<script>
// Apply the saved preference before styles paint; storage may be unavailable.
(function () {
  var preference;
  try { preference = localStorage.getItem('theme'); } catch (error) {}
  var dark = preference === 'dark' || (preference !== 'light' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
}());
</script>
