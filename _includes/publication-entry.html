{% assign pub = include.pub %}
<div class="list__item">
  <article class="archive__item publication-entry">
    <h3 class="archive__item-title"><a href="{{ pub.url | relative_url }}" rel="permalink">{{ pub.title }}</a></h3>
    <p>{% for author in pub.authors %}{% if author == site.name %}<strong>{{ author }}</strong>{% else %}{{ author }}{% endif %}{% unless forloop.last %}, {% endunless %}{% endfor %}</p>
    <p><em>{{ pub.venue }}</em>, {{ pub.year }}.</p>
    <p>{{ pub.role }} · {{ pub.note }}</p>
  </article>
</div>
