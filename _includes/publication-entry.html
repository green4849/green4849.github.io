{% assign pub = include.pub %}
<article class="publication-entry">
  <p class="entry-meta">{{ pub.year }} · {{ pub.typeLabel }}</p>
  <h3><a href="{{ pub.url | relative_url }}">{{ pub.title }}</a></h3>
  <p class="publication-authors">{% for author in pub.authors %}{% if author == site.name %}<strong>{{ author }}</strong>{% else %}{{ author }}{% endif %}{% unless forloop.last %}, {% endunless %}{% endfor %}</p>
  <p class="publication-venue">{{ pub.venue }}</p>
  <p class="publication-note">{{ pub.role }} · {{ pub.note }}</p>
</article>
