{% assign pub = include.pub %}
<li>
  <article class="archive__item publication-entry">
    <h3 class="archive__item-title"><a href="{{ pub.url | relative_url }}" rel="permalink">{{ pub.title }}</a></h3>
    <p>{% for author in pub.authors %}{% if author == site.name %}<span class="publication-self">{{ author }}</span>{% else %}{{ author }}{% endif %}{% unless forloop.last %}, {% endunless %}{% endfor %}</p>
    <p><em>{{ pub.venue }}</em>, {{ pub.year }}.</p>
    <p class="publication-note">{{ pub.role }} · {{ pub.note }}</p>
  </article>
</li>
